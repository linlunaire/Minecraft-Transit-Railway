def railNodeFluidClasses = layout.buildDirectory.dir('classes/railNodeFluidCompatibility')
tasks.register('compileRailNodeFluidCompatibility', JavaCompile) {
    dependsOn tasks.named('classes')
    source rootProject.file('tests/RailNodeFluidCompatibilityCheck.java')
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDirectory = railNodeFluidClasses
}
tasks.register('checkRailNodeFluidCompatibility', JavaExec) {
    group = 'verification'
    description = 'Checks actual vanilla fluid admission, selection and collision for every node state.'
    dependsOn 'compileRailNodeFluidCompatibility'
    classpath = files(railNodeFluidClasses) + sourceSets.main.output + configurations.compileClasspath
    mainClass = 'mtr.block.RailNodeFluidCompatibilityCheck'
    if (rootProject.hasProperty('nodeAddonJar')) {
        classpath += files(rootProject.property('nodeAddonJar'))
        args 'cn.zbx1425.mtrsteamloco.block.BlockDirectNode'
    }
}
tasks.named('check') { dependsOn 'checkRailNodeFluidCompatibility' }
