def doorClasses = layout.buildDirectory.dir('classes/doorSnapshotCompatibility')
def commonProject = project
tasks.register('checkKotlinDoorAbi', JavaExec) {
	group = 'verification'
	dependsOn ':compileKotlinMigrationAbiCheck', 'compileKotlin'
	classpath = files(rootProject.layout.buildDirectory.dir('classes/kotlinMigrationAbiCheck'))
	mainClass = 'KotlinMigrationAbiCheck'
	args 'check', rootProject.file('tests/kotlin-abi/mtr-door-java-26.2-3.3.3.tsv').absolutePath,
			tasks.named('compileKotlin').get().destinationDirectory.get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'checkKotlinDoorAbi' }
tasks.register('compileDoorSnapshotCompatibility', JavaCompile) {
	dependsOn tasks.named('classes')
	source rootProject.file('tests/DoorSnapshotCompatibilityCheck.java')
	classpath = sourceSets.main.output + configurations.compileClasspath
	destinationDirectory = doorClasses
}

['Common', 'NeoForge'].each { platform ->
	def platformProject = platform == 'Common' ? project : project(':neoforge')
	def checkTask = platformProject.tasks.register("checkDoorSnapshot${platform}", JavaExec) {
		group = 'verification'
		description = 'Checks door serialization against native save/update and loader snapshot paths.'
		dependsOn ':common:compileDoorSnapshotCompatibility'
		classpath = files(doorClasses) + commonProject.sourceSets.main.output + platformProject.configurations.compileClasspath
		mainClass = 'mtr.block.DoorSnapshotCompatibilityCheck'
	}
	commonProject.tasks.named('check') { dependsOn checkTask }
}
