name: Build

on:
  push:
    branches: [master, 'codex/kotlin-26.2-preview']
    tags: ['26.2-*']
  pull_request:
    branches: [master, 'codex/kotlin-26.2-preview']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 26.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: Minecraft-Transit-Railway-3.x.x

      - name: Checkout Transit Core
        uses: actions/checkout@v5
        with:
          repository: linlunaire/Kotlin-LunaCore
          ref: dabe86f70c01a8ffc2f55b7582abd5d7bb0d7077 # Kotlin LunaCore 0.2.1
          path: Kotlin-LunaCore

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Make Gradle Wrapper executable
        run: chmod +x Kotlin-LunaCore/gradlew Minecraft-Transit-Railway-3.x.x/gradlew

      - name: Build Transit Core prerequisite
        working-directory: Kotlin-LunaCore
        run: ./gradlew build --stacktrace

      - name: Build Fabric and NeoForge JARs
        working-directory: Minecraft-Transit-Railway-3.x.x
        run: ./gradlew build --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTR-26.2
          path: Minecraft-Transit-Railway-3.x.x/build/release/MTR-*-26.2-*.jar
          if-no-files-found: error
