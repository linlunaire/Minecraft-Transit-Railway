import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'base'
	id 'architectury-plugin' version '3.5.169'
	id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
	id 'com.gradleup.shadow' version '9.2.2' apply false
	id 'org.jetbrains.kotlin.jvm' version '2.4.20' apply false
}

apply from: 'gradle/monorepo.gradle'

ext.loader_version = "${mtr_compat_version}+yanlingmtr.${mod_version}"

if (JavaVersion.current() != JavaVersion.VERSION_25) {
	throw new GradleException('Minecraft 26.2 requires JDK 25. Set JAVA_HOME to a JDK 25 installation.')
}
if (minecraft_version != '26.2' || (project.hasProperty('buildVersion') && project.buildVersion != '26.2')) {
	throw new GradleException('This branch builds Minecraft 26.2 only. Use tag 1.21.1-3.3.2 for Minecraft 1.21.1.')
}

architectury { minecraft = minecraft_version }

ext.transitCoreRoot = file(providers.gradleProperty('transitCoreProjectDir').getOrElse(file('../Kotlin-LunaCore').isDirectory() ? '../Kotlin-LunaCore' : '../Transit-Core'))
ext.transitCoreJar = new File(transitCoreRoot, "core/build/libs/transit-core-${transit_core_version}.jar")
ext.transitCoreLoaderJar = { String loader ->
	new File(transitCoreRoot, "build/release/Kotlin-LunaCore-${loader}-${minecraft_version}-${transit_core_version}.jar")
}
tasks.register('checkTransitCoreArtifacts') {
	group = 'verification'
	description = 'Verifies the separately built Transit Core library and loader dependencies are available.'
	doLast {
		([transitCoreJar] + ['fabric', 'neoforge'].collect { transitCoreLoaderJar(it) }).each { artifact ->
			if (!artifact.isFile()) throw new GradleException("Missing Transit Core artifact: ${artifact}. Build Transit-Core first, or set -PtransitCoreProjectDir=<path>.")
		}
	}
}

def kotlinArtifactCheckClasses = layout.buildDirectory.dir('classes/kotlinCoreArtifactCheck')

def releaseArchiveClass = new GroovyClassLoader(getClass().classLoader).parseClass(file('gradle/ReleaseArchive.groovy'))
def checkReleaseArchive = tasks.register('checkReleaseArchive') {
	group = 'verification'
	inputs.files('gradle/ReleaseArchive.groovy', 'tests/ReleaseArchiveCheck.groovy')
	doLast {
		new GroovyShell(getClass().classLoader, new Binding([args: [rootProject.projectDir.absolutePath] as String[]]))
			.evaluate(rootProject.file('tests/ReleaseArchiveCheck.groovy'))
	}
}
tasks.register('compileKotlinCoreArtifactCheck', JavaCompile) {
	source 'tests/KotlinCoreArtifactCheck.java'
	classpath = files()
	destinationDirectory = kotlinArtifactCheckClasses
	options.encoding = 'UTF-8'
	options.release = 25
	sourceCompatibility = '25'
	targetCompatibility = '25'
}

tasks.register('compileKotlinMigrationAbiCheck', JavaCompile) {
	source 'tests/KotlinMigrationAbiCheck.java'
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('classes/kotlinMigrationAbiCheck')
	options.encoding = 'UTF-8'
	options.release = 25
	sourceCompatibility = '25'
	targetCompatibility = '25'
}

allprojects {
	apply plugin: 'architectury-plugin'
	group = rootProject.maven_group
	version = "${rootProject.minecraft_version}-${rootProject.mod_version}"
	repositories {
		mavenCentral()
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		['https://neoforged.forgecdn.net/releases/', 'https://maven.neoforged.net/releases/'].each { neoForgeRepository ->
			maven {
				url = neoForgeRepository
				content {
					includeGroupByRegex '(net\\.neoforged|net\\.minecraftforge|cpw\\.mods)(\\..*)?'
					includeGroup 'de.oceanlabs.mcp'
				}
			}
		}
		maven { url = 'https://maven.terraformersmc.com/' }
		// This GitHub-built module belongs to JitPack, not a loader Maven mirror.
		exclusiveContent {
			forRepository { maven { url = 'https://jitpack.io/' } }
			filter { includeModule 'com.github.jonafanho', 'Minecraft-Mod-API-Tools' }
		}
		flatDir { dirs rootProject.file('libs') }
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'
	apply plugin: 'com.gradleup.shadow'
	apply plugin: 'org.jetbrains.kotlin.jvm'
	kotlin {
		jvmToolchain(25)
		coreLibrariesVersion = rootProject.kotlin_runtime_version
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
			jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
			moduleName = "mtr_${project.name}"
		}
	}
	tasks.named('compileKotlin') { dependsOn rootProject.tasks.named('checkTransitCoreArtifacts') }
	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
	tasks.withType(JavaCompile).configureEach {
		dependsOn rootProject.tasks.named('checkTransitCoreArtifacts')
		options.encoding = 'UTF-8'
		options.release = 25
		options.compilerArgs += ['-Xmaxerrs', '1000']
	}
	configurations {
		shadowCommon
		kotlinArtifactRuntime { canBeConsumed = false }
	}
	dependencies {
		compileOnly files(rootProject.transitCoreJar)
		kotlinArtifactRuntime "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_runtime_version}"
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation name: 'Dynmap-3.2.1'
		implementation name: 'BlueMapAPI-2.1.1'
		implementation 'xyz.jpenilla:squaremap-api:1.3.15'
		implementation 'com.hierynomus:sshj:0.40.0'
		implementation "com.github.jonafanho:Minecraft-Mod-API-Tools:${rootProject.minecraft_mod_api_tools_version}"
		['jetty-http', 'jetty-io', 'jetty-security', 'jetty-server', 'jetty-servlet', 'jetty-util', 'jetty-util-ajax'].each {
			implementation "org.eclipse.jetty:${it}:9.4.58.v20250814"
			shadowCommon "org.eclipse.jetty:${it}:9.4.58.v20250814"
		}
		implementation 'javax.servlet:javax.servlet-api:4.0.1'
		shadowCommon 'javax.servlet:javax.servlet-api:4.0.1'
		implementation 'org.msgpack:msgpack-core:0.9.12'
		shadowCommon 'org.msgpack:msgpack-core:0.9.12'
	}

	if (project.name == 'common') {
		def generateKeys = tasks.register('generateKeys', Copy) {
			from 'src/main/KeysTemplate.java'
			into layout.buildDirectory.dir('generated/sources/keys/mtr')
			inputs.property 'version', project.version.toString()
			filter(ReplaceTokens, tokens: [key: '', version: project.version.toString(), lifts: 'normal', server: ''])
			rename 'KeysTemplate.java', 'Keys.java'
		}
		sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sources/keys')
		tasks.named('compileJava') { dependsOn generateKeys }
		tasks.named('compileKotlin') { dependsOn generateKeys }
	}

	processResources {
		inputs.property 'version', project.version.toString()
		inputs.property 'loaderVersion', rootProject.loader_version
		inputs.property 'transitCoreVersion', rootProject.transit_core_version
		filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
			expand version: rootProject.loader_version, transitCoreVersion: rootProject.transit_core_version
		}
		filesMatching('assets/mtr/website/version.js') {
			filter(ReplaceTokens, tokens: [version: project.version.toString()])
		}
	}
	shadowJar {
		from(rootProject.file('LICENSE')) { rename { 'LICENSE-YanlingMTR' } }
		configurations = [project.configurations.shadowCommon]
		archiveBaseName = "${rootProject.archives_base_name}-${project.name}"
		archiveClassifier = ''
		relocate 'javax.servlet', 'mtr.libraries.javax.servlet'
		relocate 'org.eclipse', 'mtr.libraries.org.eclipse'
		mergeServiceFiles()
	}
	if (project.name != 'common') {
		tasks.register('checkKotlinCoreArtifact', JavaExec) {
			group = 'verification'
			dependsOn ':compileKotlinCoreArtifactCheck', tasks.named('shadowJar')
			classpath = files(kotlinArtifactCheckClasses)
			mainClass = 'KotlinCoreArtifactCheck'
			doFirst {
				def runtime = configurations.kotlinArtifactRuntime.files.find {
					it.name == "kotlin-stdlib-${rootProject.kotlin_runtime_version}.jar"
				}
				if (runtime == null) throw new GradleException('Missing shared Kotlin runtime for artifact check')
				args tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath, 'mtr', runtime.absolutePath,
					rootProject.transitCoreLoaderJar(project.name).absolutePath
			}
		}
		tasks.register('checkPackagedKotlinMigration', JavaExec) {
			group = 'verification'
			description = 'Verifies migrated JVM contracts and Kotlin implementations in the actual release JAR.'
			dependsOn ':compileKotlinMigrationAbiCheck', tasks.named('shadowJar')
			classpath = files(rootProject.layout.buildDirectory.dir('classes/kotlinMigrationAbiCheck'))
			mainClass = 'KotlinMigrationAbiCheck'
			args 'check-packaged', rootProject.file('tests/kotlin-abi').absolutePath,
				tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
		}
		tasks.named('check') { dependsOn 'checkKotlinCoreArtifact', 'checkPackagedKotlinMigration' }
		def releaseJar = tasks.register('releaseJar', Copy) {
			dependsOn tasks.named('shadowJar'), tasks.named('check'), ':common:check', checkReleaseArchive
			from tasks.named('shadowJar').flatMap { it.archiveFile }
			into rootProject.layout.buildDirectory.dir('release')
			outputs.upToDateWhen { false }
			doLast {
				def currentName = tasks.named('shadowJar').get().archiveFile.get().asFile.name
				releaseArchiveClass.archivePrevious(destinationDir, project.name, currentName).each {
					logger.lifecycle("Archived previous ${project.name} 26.2 release: ${it}")
				}
			}
		}
		tasks.named('build') { dependsOn releaseJar }
	}
}
