rootProject.ext.transformMc26EntitySource = { String source ->
	def result = source
	if (source.contains('public class EntitySeat extends EntityBase')) {
		result = result.replace('EntityDataAccessor<Optional<UUID>>', 'EntityDataAccessor<String>')
			.replace('EntityDataSerializers.OPTIONAL_UUID', 'EntityDataSerializers.STRING')
			.replace('entityData.get(PLAYER_ID).map(value -> level().getPlayerByUUID(value)).orElse(null)', 'level().getPlayerByUUID(UUID.fromString(entityData.get(PLAYER_ID)))')
			.replace('Optional.of(new UUID(0, 0))', 'new UUID(0, 0).toString()')
			.replace('Optional.of(player.getUUID())', 'player.getUUID().toString()')
			.replace('\t\tnoCulling = true;\n', '')
	}
	if (source.contains('public class EntitySeat extends EntityBase') || source.contains('public abstract class EntityLift extends EntityBase')) {
		result = result.replace('kill();', 'kill((net.minecraft.server.level.ServerLevel) level());')
			.replace('checkInsideBlocks();', 'applyEffectsFromBlocks();')
	}
	if (source.contains('public class RenderTrains extends EntityRendererMapper<EntitySeat>')) {
		// The noCulling switch moved from the entity to its renderer in 26.2.
		result = result.replace('public class RenderTrains extends EntityRendererMapper<EntitySeat> implements IGui {', '''public class RenderTrains extends EntityRendererMapper<EntitySeat> implements IGui {
	@Override
	protected boolean affectedByCulling(EntitySeat entity) {
		return false;
	}
''')
	}
	return result
}
