rootProject.ext.transformMc26ClientModelSource = { String source ->
	def result = source
	if (source.contains('public class MTRClient ')) {
		result = result.replaceAll(/RegistryClient\.registerBlockRenderType\(RenderType\.(cutout|translucent)\(\), /) { all, layer ->
			"mtr.mappings.TerrainRenderLayers.register(net.minecraft.client.renderer.chunk.ChunkSectionLayer.${layer.toUpperCase(java.util.Locale.ROOT)}, "
		}
		// Selection now lives in items/*.json and a conditional model property, not per-item callbacks.
		def start = result.indexOf('\tpublic static void initItemModelPredicate() {')
		def end = start < 0 ? -1 : result.indexOf('\n\t}\n', start)
		if (start < 0 || end < 0) {
			throw new GradleException('Review the changed legacy item predicate initialization before migrating it.')
		}
		end += '\n\t}\n'.length()
		def method = result.substring(start, end)
		def stripped = method.replaceAll(/RegistryClient\.registerItemModelPredicate\(MTR\.MOD_ID \+ ":selected", Items\.[A-Z0-9_]+\.get\(\), ItemBlockClickingBase\.TAG_POS\);/, '')
		if (stripped.replaceAll(/\s/, '') != 'publicstaticvoidinitItemModelPredicate(){if(!Keys.LIFTS_ONLY){}}') {
			throw new GradleException('An unsupported item predicate was added; port its model condition explicitly.')
		}
		result = result.substring(0, start) + result.substring(end)
	}
	if (source.contains('class RegistryClient ') || source.contains('class RegistryClientImpl ') || source.contains('interface RegistryUtilitiesClient ') || source.contains('interface FabricRegistryUtilities ')) {
		// Remove the retired API and all platform implementations together, not empty shims.
		result = result.replaceAll(/(?m)(?:\t@ExpectPlatform\n)?\t(?:public )?static void (?:registerBlockRenderType|registerRenderType|registerItemModelPredicate)\([^\n]+\) \{\n[^}]*\}\n\n/, '')
		['dev.architectury.registry.client.rendering.RenderTypeRegistry', 'dev.architectury.registry.item.ItemPropertiesRegistry',
		 'net.fabricmc.fabric.api.blockrenderlayer.v1.BlockRenderLayerMap', 'net.fabricmc.fabric.api.object.builder.v1.client.model.FabricModelPredicateProviderRegistry'].each { name ->
			result = result.replace("import ${name};\n", '')
		}
	}
	result = result.replace('\t\tMTRClient.initItemModelPredicate();\n', '')
		.replace('\t\t\tevent.enqueueWork(MTRClient::initItemModelPredicate);\n', '')
	return result
}
