// Signature-only block migrations. The existing update/interaction bodies remain
// unchanged; version-specific behavior lives in the Java overlays below.
rootProject.ext.transformMc26BlockSource = { String source ->
	def result = source
	if (source.startsWith('package mtr.block;')) {
		result = result
			.replace('updateShape(BlockState state, Direction direction, BlockState newState, LevelAccessor world, BlockPos pos, BlockPos posFrom)', 'updateShape(BlockState state, net.minecraft.world.level.LevelReader world, net.minecraft.world.level.ScheduledTickAccess scheduledTicks, BlockPos pos, Direction direction, BlockPos posFrom, BlockState newState, net.minecraft.util.RandomSource random)')
			.replace('super.updateShape(state, direction, newState, world, pos, posFrom)', 'super.updateShape(state, world, scheduledTicks, pos, direction, posFrom, newState, random)')
			.replaceAll(/entityInside\(BlockState state, Level (\w+), BlockPos pos, Entity entity\)/, 'entityInside(BlockState state, Level $1, BlockPos pos, Entity entity, net.minecraft.world.entity.InsideBlockEffectApplier effects, boolean isPrecise)')
			.replace('getCloneItemStack(BlockGetter blockGetter, BlockPos blockPos, BlockState blockState)', 'getCloneItemStack(net.minecraft.world.level.LevelReader blockGetter, BlockPos blockPos, BlockState blockState, boolean includeData)')
			.replace('propagatesSkylightDown(BlockState state, BlockGetter world, BlockPos pos)', 'propagatesSkylightDown(BlockState state)')
			.replace('getSideEnd(LevelAccessor world, BlockPos pos, Direction offset)', 'getSideEnd(BlockGetter world, BlockPos pos, Direction offset)')

		// Block no longer owns tooltip callbacks. Only classes that actually
		// provide a tooltip implement this interface; TooltipBlockItem invokes it.
		def tooltipBlocks = [
			'BlockGlassFence', 'BlockLiftPanelBase', 'BlockPIDSBaseVertical',
			'BlockPIDSBaseHorizontal', 'BlockPoleCheckBase', 'BlockRailwaySign',
			'BlockStationNameBase', 'BlockStationColorSlab', 'BlockStationColorPole',
			'BlockStationColor', 'BlockContinuousMovementNode'
		]
		tooltipBlocks.each { name ->
			result = result.replaceAll(/(\bclass ${name} extends \w+)([^\{\r\n]*)( \{)/) { match, declaration, interfaces, brace ->
				return declaration + interfaces + (interfaces.contains(' implements ') ? ', ' : ' implements ') + 'mtr.mappings.BlockTooltip' + brace
			}
		}

		// These keys now come from Properties.overrideDescription during
		// registration; getDescriptionId itself is final in 26.2.
		result = result.replaceAll(/\t@Override\r?\n\tpublic String getDescriptionId\(\) \{\r?\n\t\treturn super\.getDescriptionId\(\)\.replace\("block\.mtr\.station_color_", "block\.minecraft\."\);\r?\n\t\}\r?\n/, '')
		result = result.replaceAll(/\t@Override\r?\n\tpublic String getDescriptionId\(\) \{\r?\n\t\treturn "block\.mtr\.railway_sign";\r?\n\t\}\r?\n/, '')
	}
	if (source.contains('public abstract class HorizontalBlockWithSoftLanding ')) {
		result = result.replace('Entity entity, float distance)', 'Entity entity, double distance)')
	}
	return result
}
