// Route only receivers declared as CompoundTag through the legacy-default bridge.
// The bridge's parameter type makes accidental matches a compile error, instead
// of changing unrelated MessagePack, JSON or packet getters with the same names.
rootProject.ext.transformMc26DataSource = { String source ->
	def result = source
		.replace('net.minecraft.util.Tuple', 'mtr.mappings.Tuple')
		.replace('CollectionTag<?>', 'CollectionTag')
	def compoundNames = (source =~ /\bCompoundTag\s+(\w+)/).collect { it[1] }.unique()
	compoundNames.each { name ->
		result = result.replaceAll(/\b${name}\.(getInt|getLong|getFloat|getDouble|getBoolean|getString|getByteArray|getLongArray|getUUID|putLongArray)\(/) { match, method ->
			return "mtr.mappings.CompoundTagMapper.${method}(${name}, "
		}
		result = result.replaceAll(/\b${name}\.getCompound\(/, "${name}.getCompoundOrEmpty(")
			.replaceAll(/\b${name}\.getAllKeys\(\)/, "${name}.keySet()")
	}
	if (source.contains('class RailwayData ')) {
		result = result.replace('tagConnections.getCompoundOrEmpty(keyConnection).getLong(KEY_NODE_POS)', 'mtr.mappings.CompoundTagMapper.getLong(tagConnections.getCompoundOrEmpty(keyConnection), KEY_NODE_POS)')
	}
	if (source.contains('class RailwayDataLoggingModule ')) {
		result = result.replace('tag.getAsString()', 'tag.asString().orElseGet(tag::toString)')
	}
	if (source.contains('public abstract class Train ')) {
		result = result.replace('ContainerHelper.loadAllItems(compoundTag.getCompoundOrEmpty(KEY_CARGO), stacks, RegistryAccess.EMPTY)', 'mtr.mappings.TrainCargoMapper.load(compoundTag, stacks)')
			.replace('ContainerHelper.saveAllItems(new CompoundTag(), stacks, RegistryAccess.EMPTY)', 'mtr.mappings.TrainCargoMapper.save(stacks)')
	}
	if (source.contains('class RailwayDataFileSaveModule ')) {
		// Finish encoding (which can reject unknown item components) before opening
		// an existing save for writing. A failed cargo migration must not truncate it.
		result = result.replace('final MessagePacker messagePacker = MessagePack.newDefaultPacker(Files.newOutputStream(dataPath, StandardOpenOption.CREATE));', 'final MessageBufferPacker messagePacker = MessagePack.newDefaultBufferPacker();')
			.replace('data.toMessagePack(messagePacker);\n\t\t\t\tmessagePacker.close();', 'data.toMessagePack(messagePacker);\n\t\t\t\tmtr.mappings.SaveFileMapper.write(dataPath, messagePacker.toByteArray());\n\t\t\t\tmessagePacker.close();')
			.replace('final Path newPath = writeMessagePackToFile(data, idToLong.apply(id), path);', 'final long dataId = idToLong.apply(id);\n\t\t\t\tfinal Path newPath = writeMessagePackToFile(data, dataId, path);')
			.replace('checkFilesToDelete.remove(newPath);', 'checkFilesToDelete.remove(newPath);\n\t\t\t\t} else {\n\t\t\t\t\t// Retain the previous file if this record could not be encoded or written.\n\t\t\t\t\tcheckFilesToDelete.remove(path.resolve(String.valueOf(dataId % 100)).resolve(String.valueOf(dataId)));')
	}
	return result
}
