// The legacy names in MTR.init are the save-compatible registry identifiers.
// Read those names instead of deriving ids from Java field names (PSD_DOOR_1,
// RAILWAY_DASHBOARD and several other fields deliberately have different ids).
def registrationIds = [Blocks: [:], Items: [:]]
def initializer = new File(rootProject.sharedRoot, 'common/src/main/java/mtr/MTR.java').getText('UTF-8')
(initializer =~ /register\w+\.accept\("([^"]+)", (Blocks|Items)\.([A-Z0-9_]+)/).each { match ->
	def names = registrationIds[match[2]]
	def previous = names.put(match[3], match[1])
	if (previous != null && previous != match[1]) {
		throw new GradleException("Conflicting registry identifiers for ${match[2]}.${match[3]}")
	}
}

rootProject.ext.transformMc26RegistrationSource = { String source ->
	def result = source
	registrationIds.each { owner, names ->
		if (result.contains("public interface ${owner} {")) {
			result = result.replaceAll(/(RegistryObject<\w+> ([A-Z0-9_]+) = new RegistryObject<>\()/) { match, prefix, field ->
				def path = names[field]
				if (path == null) {
					throw new GradleException("Missing explicit registration identifier for ${owner}.${field}")
				}
				return "${prefix}\"${path}\", "
			}
			if (owner == 'Blocks') {
				result = result.replaceAll(/new (Block|SlabBlock)\(BlockBehaviour\.Properties\.of\(\)/) { match, type ->
					return "new ${type}(mtr.mappings.RegistrationContext.blockProperties(BlockBehaviour.Properties.of())"
				}
			}
		}
	}
	if (result.contains('public abstract class BlockMapper extends Block {') || result.contains('public abstract class BlockDirectionalMapper extends HorizontalDirectionalBlock {')) {
		result = result.replace('super(properties);', 'super(RegistrationContext.blockProperties(properties));')
	}
	if (result.contains('public class BlockStationColor extends BlockMapper {') || result.contains('public class BlockStationColorSlab extends SlabBlock {')) {
		result = result.replace('super(settings);', 'super(mtr.mappings.RegistrationContext.stationColorProperties(settings));')
	}
	if (result.contains('public class BlockRailwaySign extends BlockDirectionalMapper ')) {
		result = result.replace('super(Properties.of()', 'super(Properties.of().overrideDescription("block.mtr.railway_sign")')
	}
	if (result.contains('public class PlaceOnWaterBlockItem extends net.minecraft.world.item.PlaceOnWaterBlockItem {')) {
		result = result.replace('super(block, properties);', 'super(block, properties.overrideDescription(block.getDescriptionId()));')
	}
	if (result.contains('public class MTRFabric ') || result.contains('public class MTRForge ')) {
		result = result.replace('RegistryUtilities.createItemProperties(creativeModeTab::get)', 'RegistryUtilities.createBlockItemProperties(path, block.get())')
		result = result.replace('RegistryUtilities.createItemProperties(creativeModeTabWrapper::get)', 'RegistryUtilities.createBlockItemProperties(path, block.get())')
		result = result.replace('new BlockItem(', 'new mtr.mappings.TooltipBlockItem(')
	}
	if (result.contains('public interface EntityTypes {')) {
		result = result.replace('.build("seat")', '.build(mtr.mappings.RegistryUtilities.entityKey("seat"))')
		result = result.replace('.build(key)', '.build(mtr.mappings.RegistryUtilities.entityKey(key))')
	}
	return result
}
