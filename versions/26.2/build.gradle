import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'architectury-plugin' version '3.5.169'
	id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
	id 'com.gradleup.shadow' version '9.2.2' apply false
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
	throw new GradleException('Minecraft 26.2 requires Java 25. Set JAVA_HOME to a JDK 25 installation.')
}
if (project.minecraft_version != '26.2' || (project.hasProperty('buildVersion') && project.buildVersion != '26.2')) {
	throw new GradleException('This Gradle root builds Minecraft 26.2 only. Select 1.21.1 using the repository wrapper: gradlew build -Version="1.21.1".')
}

ext.sharedRoot = file('../..')
def sharedProperties = new Properties()
new File(sharedRoot, 'gradle.properties').withInputStream { sharedProperties.load(it) }
ext.mod_version = sharedProperties.getProperty('mod_version')
ext.minecraft_mod_api_tools_version = sharedProperties.getProperty('minecraft_mod_api_tools_version')
ext.transformMc26Source = { String source -> source }
if (file('source-port.gradle').isFile()) {
	apply from: 'source-port.gradle'
}

architectury { minecraft = project.minecraft_version }

allprojects {
	apply plugin: 'architectury-plugin'
	group = sharedProperties.getProperty('maven_group')
	version = "${rootProject.minecraft_version}-${rootProject.mod_version}"
	repositories {
		mavenCentral()
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://neoforged.forgecdn.net/releases/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
		maven { url = 'https://maven.terraformersmc.com/' }
		maven { url = 'https://jitpack.io/' }
		flatDir { dirs new File(rootProject.sharedRoot, 'libs') }
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'
	apply plugin: 'com.gradleup.shadow'
	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
		options.compilerArgs += ['-Xmaxerrs', '1000']
	}
	configurations { shadowCommon }
	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation name: 'Dynmap-3.2.1'
		implementation name: 'BlueMapAPI-2.1.1'
		implementation 'xyz.jpenilla:squaremap-api:1.3.15'
		implementation 'com.hierynomus:sshj:0.40.0'
		implementation "com.github.jonafanho:Minecraft-Mod-API-Tools:${rootProject.minecraft_mod_api_tools_version}"
		['jetty-http', 'jetty-io', 'jetty-security', 'jetty-server', 'jetty-servlet', 'jetty-util', 'jetty-util-ajax'].each {
			implementation "org.eclipse.jetty:${it}:9.4.58.v20250814"
			shadowCommon "org.eclipse.jetty:${it}:9.4.58.v20250814"
		}
		implementation 'javax.servlet:javax.servlet-api:4.0.1'
		shadowCommon 'javax.servlet:javax.servlet-api:4.0.1'
		implementation 'org.msgpack:msgpack-core:0.9.12'
		shadowCommon 'org.msgpack:msgpack-core:0.9.12'
	}

	def sharedModule = project.name == 'neoforge' ? 'forge' : project.name
	def sharedJava = new File(rootProject.sharedRoot, "${sharedModule}/src/main/java")
	def overlayJava = file('src/main/java')
	def generatedJava = layout.buildDirectory.dir('generated/sources/mtr')
	def prepareSources = tasks.register('prepareSources', Sync) {
		inputs.file(rootProject.file('source-port.gradle')).optional()
		inputs.file(rootProject.file('registration-port.gradle'))
		inputs.file(rootProject.file('gui-port.gradle'))
		inputs.file(rootProject.file('data-port.gradle'))
		inputs.file(rootProject.file('block-port.gradle'))
		inputs.file(rootProject.file('entity-port.gradle'))
		inputs.file(rootProject.file('item-port.gradle'))
		inputs.file(rootProject.file('render-port.gradle'))
		inputs.file(rootProject.file('client-model-port.gradle'))
		inputs.file(rootProject.file('loader-port.gradle'))
		inputs.file(new File(rootProject.sharedRoot, 'common/src/main/java/mtr/MTR.java'))
		inputs.file(new File(rootProject.sharedRoot, 'common/src/main/java/mtr/MTRClient.java'))
		inputs.files(fileTree(overlayJava))
		inputs.property 'version', project.version.toString()
		if (project.name == 'common') {
			inputs.file(new File(rootProject.sharedRoot, 'common/src/main/KeysTemplate.java'))
		}
		from(sharedJava) {
			exclude 'FileGenerator.java', 'ModUpload.java', 'UpdateSolder.java'
			// Shared 26.2 mixins replace both loaders' legacy render hooks. Vanilla
			// now constructs all registered seat/lift types and recreates their spawn data.
			exclude 'mtr/mixin/GameRendererMixin.java', 'mtr/mixin/LevelRendererMixin.java',
				'mtr/mixin/PlayerRendererOffsetMixin.java', 'mtr/mixin/EntitySpawnMixin.java'
		}
		into generatedJava
		doLast {
			fileTree(destinationDir).matching { include '**/*.java' }.each { source ->
				source.setText(rootProject.transformMc26Source(source.getText('UTF-8')), 'UTF-8')
			}
			project.copy { from overlayJava; into destinationDir }
			if (project.name == 'common') {
				project.copy {
					from new File(rootProject.sharedRoot, 'common/src/main/KeysTemplate.java')
					into new File(destinationDir, 'mtr')
					filter(ReplaceTokens, tokens: [key: '', version: project.version.toString(), lifts: 'normal', server: ''])
					rename 'KeysTemplate.java', 'Keys.java'
				}
			}
		}
	}
	sourceSets.main.java.setSrcDirs([generatedJava])
	tasks.named('compileJava') { dependsOn prepareSources }

	def sharedResources = new File(rootProject.sharedRoot, "${sharedModule}/src/main/resources")
	processResources {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		// Copy filters are not themselves tracked as task inputs.
		inputs.file(rootProject.buildFile)
		from(sharedResources) {
			exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml', 'mtr.mixins.json', 'pack.mcmeta'
			if (project.name == 'common') exclude 'data/**'
		}
		if (project.name == 'common') {
			from(new File(rootProject.sharedRoot, 'resources/common/lifts')) { exclude 'pack.mcmeta', 'data/**' }
			from(new File(rootProject.sharedRoot, 'resources/common/normal')) { exclude 'pack.mcmeta', 'data/**' }
		} else {
			from(new File(rootProject.sharedRoot, "resources/${sharedModule}/normal")) {
				exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml', 'mtr.mixins.json', 'pack.mcmeta'
			}
		}
		inputs.property 'version', project.version
		filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
			expand version: project.version
		}
		filesMatching('assets/mtr/lang/*.json') {
			filter { line -> line.replace('"category.mtr.keybinding"', '"key.category.mtr.keybinding"') }
		}
		filesMatching(['assets/mtr/models/block/station_color_quartz_pillar.json',
			'assets/mtr/models/block/station_color_quartz_pillar_slab_bottom.json',
			'assets/mtr/models/block/station_color_quartz_pillar_slab_top.json']) {
			filter { line -> line.replace('"block/quartz_pillar"', '"minecraft:block/quartz_pillar_side"') }
		}
	}
	shadowJar {
		configurations = [project.configurations.shadowCommon]
		archiveBaseName = "MTR-${project.name}"
		archiveClassifier = ''
		relocate 'javax.servlet', 'mtr.libraries.javax.servlet'
		relocate 'org.eclipse', 'mtr.libraries.org.eclipse'
		mergeServiceFiles()
	}
	if (project.name != 'common') {
		def releaseJar = tasks.register('releaseJar', Copy) {
			dependsOn tasks.named('shadowJar')
			dependsOn tasks.named('check'), ':common:check'
			from tasks.named('shadowJar').flatMap { it.archiveFile }
			into new File(rootProject.sharedRoot, 'build/release')
			doFirst {
				delete fileTree(destinationDir).matching {
					include "MTR-${project.name}-${rootProject.minecraft_version}-*.jar"
				}
			}
		}
		tasks.named('build') { dependsOn releaseJar }
	}
}
