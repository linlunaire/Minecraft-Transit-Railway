rootProject.ext.transformMc26RenderSource = { String source ->
	def result = source.replace('import net.minecraft.client.renderer.MultiBufferSource;', 'import mtr.mappings.RenderBufferSource;')
		.replace('MultiBufferSource.BufferSource', 'RenderBufferSource')
		.replaceAll(/\bMultiBufferSource\b/, 'RenderBufferSource')
		.replace('RenderType.lines()', 'net.minecraft.client.renderer.rendertype.RenderTypes.lines()')
		.replace('shouldRenderOffScreen(T blockEntity)', 'shouldRenderOffScreen()')
	if (source.contains('public class RenderTrains extends')) {
		result = result.replace('import com.mojang.blaze3d.vertex.ByteBufferBuilder;\n', '')
			.replace('''	// ByteBufferBuilder owns native memory. Keep one render-thread buffer instead of allocating one for every train display, sign, or lift each frame.
	private static final ByteBufferBuilder IMMEDIATE_BUFFER = new ByteBufferBuilder(256);
	private static final RenderBufferSource IMMEDIATE_BUFFER_SOURCE = RenderBufferSource.immediate(IMMEDIATE_BUFFER);
''', '')
			.replace('return IMMEDIATE_BUFFER_SOURCE;', 'return RenderBufferSource.current().immediate();')
			.replace('final Vec3 cameraPosition = client.gameRenderer.mainCamera().getPosition();', '''// Geometry is extracted relative to the seat origin; the submit pose supplies
			// the matching entity-to-camera translation, exactly once.
			final Vec3 cameraPosition = RenderBufferSource.current().origin();''')
	}
	if (source.contains('public interface UtilitiesClient {')) {
		// All GUI callers now queue explicit pipelines. Remove the obsolete stateful API.
		result = result.replace('''	static void beginDrawingRectangle(BufferBuilder buffer) {
		RenderSystem.setShader(GameRenderer::getPositionColorShader);
	}

	static void finishDrawingRectangle() {
	}

	static void beginDrawingTexture(Identifier textureId) {
		RenderSystem.setShader(GameRenderer::getPositionTexShader);
		RenderSystem.setShaderTexture(0, textureId);
	}

''', '')
		result = result.replace('return textRenderer.drawInBatch(formattedCharSequence, x, y, color, shadow, matrix4f, immediate, Font.DisplayMode.NORMAL, overlay, light);', '''immediate.drawText(formattedCharSequence, x, y, color, shadow, matrix4f, overlay, light);
		return (int) (x + textRenderer.width(formattedCharSequence)) + (shadow ? 1 : 0);''')
			.replace('''	static EntityModel<Minecart> getMinecartModel() {
		return new MinecartModel<>(MinecartModel.createBodyLayer().bakeRoot());
	}

	static EntityModel<Boat> getBoatModel() {
		return new BoatModel(BoatModel.createBodyModel().bakeRoot());
	}
''', '')
		['net.minecraft.client.model.BoatModel', 'net.minecraft.client.model.EntityModel', 'net.minecraft.client.model.MinecartModel',
		 'net.minecraft.world.entity.vehicle.Boat', 'net.minecraft.world.entity.vehicle.Minecart'].each { name ->
			result = result.replace("import ${name};\n", '')
		}
	}
	if (source.contains('public class JonModelTrainRenderer extends')) {
		result = result.replace('private static final EntityModel<Minecart> MODEL_MINECART = UtilitiesClient.getMinecartModel();', '')
			.replace('private static final EntityModel<Boat> MODEL_BOAT = UtilitiesClient.getBoatModel();', '')
			.replace('private static final Long2ObjectOpenHashMap<FakeBoat> BOATS = new Long2ObjectOpenHashMap<>();', '')
			.replace('BOATS.remove(trainId);', 'mtr.mappings.VanillaVehicleModels.removeTrain(trainId);')
			.replace('BOATS.clear();', 'mtr.mappings.VanillaVehicleModels.clearTrains();')
		def oldStart = result.indexOf('\t\t\tfinal EntityModel<? extends Entity> model = isBoat ? MODEL_BOAT : MODEL_MINECART;')
		def oldEndMarker = 'model.renderToBuffer(matrices, vertexConsumer, light, OverlayTexture.NO_OVERLAY, 0xFFFFFFFF);'
		def oldEnd = result.indexOf(oldEndMarker, oldStart)
		if (oldStart < 0 || oldEnd < 0) {
			throw new GradleException('The legacy vanilla vehicle render block changed; review the 26.2 model conversion.')
		}
		result = result.substring(0, oldStart) + '''			mtr.mappings.VanillaVehicleModels.render(isBoat, train.id,
				(train.getSpeed() + Train.ACCELERATION_DEFAULT) * (doorLeftValue == 0 && doorRightValue == 0 ? lastFrameDuration : 0),
				matrices, vertexConsumers, resolveTexture(textureId, textureId -> textureId + ".png"), light);''' + result.substring(oldEnd + oldEndMarker.length())
		result = result.replace('''	private static class FakeBoat extends Boat {

		private float progress;

		public FakeBoat() {
			super(EntityType.BOAT, null);
		}

		@Override
		public float getRowingTime(int paddle, float newProgress) {
			progress += newProgress;
			return progress;
		}
	}
''', '')
		['net.minecraft.client.model.EntityModel', 'net.minecraft.world.entity.Entity', 'net.minecraft.world.entity.EntityType',
		 'net.minecraft.world.entity.vehicle.Boat', 'net.minecraft.world.entity.vehicle.Minecart',
		 'it.unimi.dsi.fastutil.longs.Long2ObjectOpenHashMap'].each { name ->
			result = result.replace("import ${name};\n", '')
		}
		result = result.replace('camera.getBlockPosition()', 'camera.blockPosition()')
	}
	if (source.contains('public class ResourcePackCreatorProperties ') || source.contains('public class ResourcePackCreatorScreen ')) {
		// The per-loader preview entrypoint must establish an extraction scope before these calls.
		result = result.replace('minecraft.renderBuffers().bufferSource()', 'RenderBufferSource.current().immediate()')
	}
	if (source.contains('public class ResourcePackCreatorScreen ')) {
		// Dynamic solid geometry retains the opaque, depth-writing preview background.
		result = result.replace('immediate.getBuffer(RenderType.solid())', 'immediate.getBuffer(net.minecraft.client.renderer.rendertype.RenderTypes.solidMovingBlock())')
	}
	if (source.contains('public interface RegistryUtilitiesClient ')) {
		result = result.replace('import net.minecraft.client.color.block.BlockColor;', 'import net.minecraft.client.color.block.BlockTintSource;')
			.replace('registerBlockColors(BlockColor blockColor,', 'registerBlockColors(BlockTintSource blockColor,')
	}
	if (source.contains('public class ClientCache ')) {
		result = result.replace('new DynamicTexture(nativeImage)', 'new DynamicTexture(() -> "MTR dynamic " + key, nativeImage)')
	}
	if (source.contains('public class ResourcePackCreatorProperties ')) {
		result = result.replace('texture = minecraft.getTextureManager().register(MTR.MOD_ID, new DynamicTexture(nativeImage));', '''final DynamicTexture dynamicTexture;
			try {
				dynamicTexture = new DynamicTexture(() -> "MTR creator preview", nativeImage);
			} catch (RuntimeException | Error failure) {
				nativeImage.close();
				throw failure;
			}
			// Register replaces and closes the previous preview texture at this stable id.
			final Identifier previewId = Identifier.fromNamespaceAndPath(MTR.MOD_ID, "dynamic/creator_preview");
			minecraft.getTextureManager().register(previewId, dynamicTexture);
			texture = previewId;''')
	}
	if (source.contains('public abstract class TrainRendererBase ')) {
		result = result.replace('entityRenderDispatcher.render(renderPlayer, playerPositionOffset.x, playerPositionOffset.y, playerPositionOffset.z, 0, 1, matrices, vertexConsumers, 0xF000F0);',
			'vertexConsumers.drawEntity(entityRenderDispatcher, renderPlayer, 1, matrices.last().pose(), playerPositionOffset.x, playerPositionOffset.y, playerPositionOffset.z, 0xF000F0);')
	}
	if (source.contains('public class RenderPIDS<')) {
		result = result.replace('font.drawInBatch(text, 0, 0, color, false, matrices.last().pose(), vertexConsumers, Font.DisplayMode.NORMAL, 0, light);',
			'vertexConsumers.drawText(text, 0, 0, color, false, matrices.last().pose(), 0, light);')
	}
	return result
}
