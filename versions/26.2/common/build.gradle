def dataPortFile = rootProject.file('DataResourcePort.groovy')
def dataPort = new GroovyClassLoader(getClass().classLoader).parseClass(dataPortFile)
def dataRoots = [new File(rootProject.sharedRoot, 'resources/common/lifts/data'),
	new File(rootProject.sharedRoot, 'resources/common/normal/data'),
	new File(rootProject.sharedRoot, 'common/src/main/resources/data')]
def dataResources = layout.buildDirectory.dir('generated/resources/dataDefinitions')
def prepareDataResources = tasks.register('prepareDataResources') {
	inputs.file(dataPortFile)
	inputs.files(dataRoots.collect { fileTree(it) })
	outputs.dir(dataResources)
	doLast {
		def converted = new TreeMap<String, Map>()
		dataRoots.each { dataRoot ->
			fileTree(dataRoot).matching { include '**/*.json' }.files.sort().each { input ->
				def path = 'data/' + dataRoot.toPath().relativize(input.toPath()).toString().replace('\\', '/')
				def target = dataPort.targetPath(path)
				def json = dataPort.convert(path, new groovy.json.JsonSlurper().parse(input))
				converted[target] = dataPort.merge(target, converted[target], json)
			}
		}
		// Finish validation before replacing this task's generated output.
		def output = dataResources.get().asFile
		delete output
		converted.each { path, json ->
			def target = new File(output, path)
			target.parentFile.mkdirs()
			target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n', 'UTF-8')
		}
	}
}
tasks.named('processResources') {
	dependsOn prepareDataResources
	from(dataResources)
}

def legacyItemModels = new File(rootProject.sharedRoot, 'common/src/main/resources/assets/mtr/models/item')
def itemRegistrationSource = new File(rootProject.sharedRoot, 'common/src/main/java/mtr/MTR.java')
def itemDefinitions = layout.buildDirectory.dir('generated/resources/itemDefinitions')
def prepareItemDefinitions = tasks.register('prepareItemModelDefinitions') {
	inputs.dir(legacyItemModels)
	inputs.file(itemRegistrationSource)
	outputs.dir(itemDefinitions)
	doLast {
		def registeredItems = new TreeSet<String>()
		(itemRegistrationSource.getText('UTF-8') =~ /(register\w+)\.accept\("([^"]+)", (Blocks|Items)\./).each { declaration ->
			if (declaration[1] != 'registerBlock') registeredItems.add(declaration[2])
		}
		if (registeredItems.isEmpty()) throw new GradleException('No registered MTR items found; review item registration parsing.')
		def definitions = new TreeMap<String, Map>()
		registeredItems.each { name ->
			def input = new File(legacyItemModels, "${name}.json")
			if (!input.isFile()) throw new GradleException("Registered item ${name} has no legacy model.")
			def legacy = new groovy.json.JsonSlurper().parse(input)
			def model = [type: 'minecraft:model', model: "mtr:item/${name}"]
			(legacy.overrides ?: []).each { override ->
				if (override.predicate != ['mtr:selected': 1] || !(override.model instanceof String)) {
					throw new GradleException("Unsupported legacy item override in ${input}; migrate it explicitly.")
				}
				// Later overrides take precedence, as in the old predicate evaluator.
				model = [type: 'minecraft:condition', property: 'mtr:selected',
					on_true: [type: 'minecraft:model', model: override.model], on_false: model]
			}
			definitions[name] = [model: model]
		}
		// Selected submodels remain in models/item, but are not registered item roots.
		def output = itemDefinitions.get().asFile
		delete output
		def items = new File(output, 'assets/mtr/items')
		definitions.each { name, definition ->
			def target = new File(items, "${name}.json")
			target.parentFile.mkdirs()
			target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(definition)) + '\n', 'UTF-8')
		}
	}
}
tasks.named('processResources') {
	dependsOn prepareItemDefinitions
	from(itemDefinitions)
}

// Keep persistence checks runnable while the remaining render/client port is incomplete.
def persistenceClasses = layout.buildDirectory.dir('classes/persistenceCompatibility')
def compilePersistence = tasks.register('compilePersistenceCompatibility', JavaCompile) {
	source 'src/main/java/mtr/mappings/PersistentStateMapper.java',
		'src/main/java/mtr/mappings/BlockEntityMapper.java',
		'src/main/java/mtr/mappings/CompoundTagMapper.java',
		'../tests/PersistenceCompatibilityCheck.java'
	classpath = configurations.compileClasspath
	destinationDirectory = persistenceClasses
}
tasks.register('checkPersistenceCompatibility', JavaExec) {
	group = 'verification'
	description = 'Checks the 26.2 persistence overlays against actual game classes.'
	dependsOn compilePersistence
	// These checks bootstrap vanilla classes, not a Fabric/NeoForge game launch.
	classpath = files(persistenceClasses) + configurations.compileClasspath
	mainClass = 'mtr.mappings.PersistenceCompatibilityCheck'
}

