architectury {
	platformSetupLoomIde()
	neoForge()
}

tasks.named('shadowJar') { exclude 'META-INF/mods.toml' }

configurations {
	common
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	runtimeOnly files(rootProject.transitCoreLoaderJar('neoforge'))
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
	common(project(path: ':common', configuration: 'apiElements')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
