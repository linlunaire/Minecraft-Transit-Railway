dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version[1]}"
	modApi "${rootProject.architectury_id}:architectury:${rootProject.architectury_data[0].split("\\+")[0]}"
}

architectury {
	common("fabric", "neoforge")
}

// These are standalone maintenance tools, not mod code. Architectury Transformer's
// development runtime cannot process classes in the default package.
sourceSets {
	main {
		java {
			exclude "FileGenerator.java", "ModUpload.java", "UpdateSolder.java"
		}
	}
}

tasks.register("moveCommonBuilds") {
	doLast {
		delete fileTree("../build/libs").matching {
			include "**/MTR-common*"
		}
		delete fileTree("../build/latest").matching {
			include "**/MTR-common*"
		}
		if (rootProject.variation == "server") {
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
			copy {
				from "build/devlibs"
				include "*dev.jar"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
		}
	}
}

tasks.named("build") {
	finalizedBy tasks.named("moveCommonBuilds")
}
