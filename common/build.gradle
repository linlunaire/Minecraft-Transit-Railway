def compileCargo = tasks.register('compileCargoCompatibility', JavaCompile) {
	source 'src/main/java/mtr/mappings/TrainCargoMapper.java', 'src/main/java/mtr/mappings/SaveFileMapper.java', '../tests/CargoCompatibilityCheck.java'
	classpath = configurations.compileClasspath
	destinationDirectory = cargoClasses
