def compatibilityChecks = tasks.register('checkCompatibility') {
	group = 'verification'
	description = 'Runs standalone 26.2 compatibility checks, including persistence, rendering, resources, networking, screens and save queues.'
	dependsOn 'checkRegistrationCompatibility', 'checkPersistenceCompatibility', 'checkCargoCompatibility', 'checkEntityCompatibility', 'checkModelCompatibility', 'checkRenderCompatibility', 'checkClientModelCompatibility', 'checkDataResourceCompatibility'
}
tasks.named('check') { dependsOn compatibilityChecks }

