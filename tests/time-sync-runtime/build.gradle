plugins {
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.11.458'
}
version = '1'
loom { silentMojangMappingsLicense() }
architectury {
    minecraft = '1.21.1'
    platformSetupLoomIde()
    neoForge()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://maven.neoforged.net/releases' }
}
def candidate = file(findProperty('timeSyncTestJar') ?: '../../build/release/YanlingMTR-neoforge-1.21.1-1.0.2.jar')
def probeName = (findProperty('probeName') ?: 'candidate').toString()
if (!(probeName ==~ /[a-zA-Z0-9-]+/)) throw new GradleException('probeName must be a short alphanumeric name')
def clientDir = file("../../build/diagnostics/time-sync-runtime/client-${probeName}")
if (!candidate.isFile()) throw new GradleException('Build the release JAR first, or specify timeSyncTestJar.')
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.layered {
        officialMojangMappings()
        parchment 'org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip'
    }
    neoForge "net.neoforged:neoforge:${findProperty('probeNeoForgeVersion') ?: '21.1.252'}"
    modImplementation 'dev.architectury:architectury-neoforge:13.0.11'
    modImplementation files(candidate)
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
loom.runs {
    client {
        client()
        runDir = projectDir.toPath().relativize(clientDir.toPath()).toString()
    }
}
tasks.named('runClient') {
    doLast {
        def log = new File(clientDir, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('TIME_SYNC_RUNTIME_PASS:') || log.contains('TIME_SYNC_RUNTIME_FAIL') || log.contains('Error executing task on Server'))
            throw new GradleException('Native time sync regression did not pass; see the private client log.')
    }
}
