plugins {
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.11.458'
}
loom { silentMojangMappingsLicense() }
version = '1'
architectury {
    minecraft = '1.21.1'
    platformSetupLoomIde()
    neoForge()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://maven.neoforged.net/releases' }
}
def mtr = file(findProperty('mtrTestJar') ?: '../../forge/build/libs/neoforge-1.21.1-1.0.3.jar')
def ylte = file(findProperty('ylteTestJar') ?: '../../../mtr-ante-1.21.1/forge/build/libs/YLTE-neoforge-1.1.1-1.21.1.jar')
def probeName = (findProperty('probeName') ?: 'candidate').toString()
if (!(probeName ==~ /[a-zA-Z0-9-]+/)) throw new GradleException('Invalid probeName')
if (!mtr.isFile() || !ylte.isFile()) throw new GradleException('Build the selected 1.21.1 artifacts first.')
def clientDir = file("../../build/diagnostics/health-review-2026-10-11/client-${probeName}")
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.layered {
        officialMojangMappings()
        parchment 'org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip'
    }
    neoForge 'net.neoforged:neoforge:21.1.252'
    modImplementation 'dev.architectury:architectury-neoforge:13.0.11'
    modImplementation files(mtr, ylte)
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
loom.runs {
    client {
        client()
        runDir = projectDir.toPath().relativize(clientDir.toPath()).toString()
    }
}
tasks.named('runClient') {
    doLast {
        def log = new File(clientDir, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('HEALTH_RUNTIME_PASS:') || log.contains('HEALTH_CASE_FAIL:'))
            throw new GradleException('Maintenance health regression failed; see the isolated client log.')
    }
}
