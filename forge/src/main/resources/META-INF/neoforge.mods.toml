modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "mtr"
version = "${version}"
displayName = "YanlingMTR"
authors = "linlunaire, Jonathan Ho, MTR contributors"
description = "Automated railways, stations and passenger information displays. An independent community fork of Minecraft Transit Railway for Minecraft 1.21.1."
logoFile = "icon.png"

[[mixins]]
config = "mtr.mixins.json"

[[dependencies.mtr]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.248,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtr]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtr]]
modId = "architectury"
mandatory = true
versionRange = "[13.0.11,14)"
ordering = "AFTER"
side = "BOTH"
