[[dependencies.mtr]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtr]]
modId = "architectury"
mandatory = true
versionRange = "[13.0.11,14)"
ordering = "AFTER"
side = "BOTH"
