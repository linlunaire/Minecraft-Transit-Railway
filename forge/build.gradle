import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.taskdefs.condition.Os

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	// shadowCommon is only for producing the final shaded JAR.  Adding it to
	// the NeoForge development runtime duplicates the ForgeRuntimeLibrary
	// copies of Jetty and causes a Java module-package conflict.
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	modApi "${rootProject.architectury_id}:architectury-neoforge:${rootProject.architectury_data[0].split("\\+")[0]}"
	// The common module starts MTR's embedded web server during initialization.
	// NeoForge's development runtime does not inherit the root shadow configuration.
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-http:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-io:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-security:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-server:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-servlet:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-util:${rootProject.jetty_version}"
	forgeRuntimeLibrary "org.eclipse.jetty:jetty-util-ajax:${rootProject.jetty_version}"
	forgeRuntimeLibrary "javax.servlet:javax.servlet-api:${rootProject.servlet_version}"
	forgeRuntimeLibrary "org.msgpack:msgpack-core:${rootProject.msgpack_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

def modVersionForResources = project.version

processResources {
	inputs.property "version", modVersionForResources

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": modVersionForResources
	}
}

shadowJar {
	exclude "fabric.mod.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
	relocate "javax.servlet", "mtr.libraries.javax.servlet"
	relocate "org.eclipse", "mtr.libraries.org.eclipse"
	mergeServiceFiles()
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveBaseName.set("neoforge")
	archiveClassifier.set("")
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

tasks.register("moveNeoForgeBuilds") {
	doLast {
		delete fileTree("../build/release").matching {
			include "${rootProject.variation_header}-forge*"
			include "${rootProject.variation_header}-neoforge*"
		}
		delete fileTree("../build/libs").matching {
			include "${rootProject.variation_header}-forge*"
			include "${rootProject.variation_header}-neoforge*"
		}
		delete fileTree("../build/latest").matching {
			include "${rootProject.variation_header}-forge*"
			include "${rootProject.variation_header}-neoforge*"
		}
		copy {
			from "build/libs"
			include "neoforge-*.jar"
			exclude "*-dev-shadow.jar"
			into "../build/release"
			rename "(.+)", "${rootProject.variation_header}-\$1"
		}
		if (rootProject.variation == "normal") {
			copy {
				from "build/libs"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
			copy {
				from "build/libs"
				include "*${rootProject.mod_version}-dev-shadow.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
		}
	}
}

tasks.register("testServer") {
	doLast {
		if (rootProject.variation == "normal") {
			copy {
				from "../resources/eula.txt"
				into "server"
			}
			copy {
				from "../resources/server.properties"
				into "server"
				filter(ReplaceTokens, tokens: ["port": String.valueOf(25500 + new Random().nextInt(500))])
			}
			copy {
				from "../build/latest"
				into "server/mods"
				include "MTR-neoforge-*-latest.jar"
				rename "(.+)", "MTR.jar"
			}
			download {
				src rootProject.architectury_data[1]
				dest "forge/server/mods/architectury.jar"
				overwrite true
				retries - 1
			}
			download {
				src "https://maven.minecraftforge.net/net/minecraftforge/forge/${rootProject.forge_version}/forge-${rootProject.forge_version}-installer.jar"
				dest "forge/server/forge-installer.jar"
				overwrite true
				retries - 1
			}
			javaexec {
				mainClass = "-jar"
				args = ["forge-installer.jar", "--installServer"]
				workingDir = "server"
			}
			if (!rootProject.forge_version.startsWith("1.16.5")) {
				javaexec {
					mainClass = "@libraries/net/minecraftforge/forge/${rootProject.forge_version}/${Os.isFamily(Os.FAMILY_WINDOWS) ? "win" : "unix"}_args.txt"
					args = ["nogui"]
					jvmArgs = ["-Xms4G", "-Xmx4G"]
					workingDir = "server"
				}
			}
		}
	}
}

tasks.named("build") {
	finalizedBy tasks.named("moveNeoForgeBuilds")
}
