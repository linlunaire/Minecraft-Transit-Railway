import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.taskdefs.condition.Os

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	// The final NeoForge JAR embeds the libraries in shadowCommon.  Make them
	// available to Loom's NeoForge development runtime as well.
	developmentNeoForge.extendsFrom common, shadowCommon
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	modApi "${rootProject.architectury_id}:architectury-neoforge:${rootProject.architectury_data[0].split("\\+")[0]}"
	// The common module starts MTR's embedded web server during initialization.
	// NeoForge's development runtime does not inherit the root shadow configuration.
	runtimeOnly "org.eclipse.jetty:jetty-http:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-io:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-security:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-server:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-servlet:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-util:9.+"
	runtimeOnly "org.eclipse.jetty:jetty-util-ajax:9.+"
	runtimeOnly "javax.servlet:javax.servlet-api:+"
	runtimeOnly "org.msgpack:msgpack-core:+"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "fabric.mod.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
	relocate "javax.servlet", "mtr.libraries.javax.servlet"
	relocate "org.eclipse", "mtr.libraries.org.eclipse"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set("")
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task moveForgeBuilds() {
	doLast {
		delete fileTree("../build/release").matching {
			include "**/${rootProject.variation_header}-forge*"
		}
		delete fileTree("../build/libs").matching {
			include "**/${rootProject.variation_header}-forge*"
		}
		delete fileTree("../build/latest").matching {
			include "**/${rootProject.variation_header}-forge*"
		}
		copy {
			from "build/libs"
			include "*${rootProject.mod_version}.jar"
			into "../build/release"
			rename "(.+)", "${rootProject.variation_header}-\$1"
		}
		if (rootProject.variation == "normal") {
			copy {
				from "build/libs"
				into "../build/latest"
				rename { fileName -> "MTR-${fileName.replace(rootProject.mod_version, "latest")}" }
			}
			copy {
				from "build/libs"
				include "*${rootProject.mod_version}-dev-shadow.jar"
				into "../build/libs"
				rename "(.+)", "MTR-\$1"
			}
		}
	}
}

task testServer {
	doLast {
		if (rootProject.variation == "normal") {
			copy {
				from "../resources/eula.txt"
				into "server"
			}
			copy {
				from "../resources/server.properties"
				into "server"
				filter(ReplaceTokens, tokens: ["port": String.valueOf(25500 + new Random().nextInt(500))])
			}
			copy {
				from "../build/latest"
				into "server/mods"
				include "MTR-forge-*-latest.jar"
				rename "(.+)", "MTR.jar"
			}
			download {
				src rootProject.architectury_data[1]
				dest "forge/server/mods/architectury.jar"
				overwrite true
				retries - 1
			}
			download {
				src "https://maven.minecraftforge.net/net/minecraftforge/forge/${rootProject.forge_version}/forge-${rootProject.forge_version}-installer.jar"
				dest "forge/server/forge-installer.jar"
				overwrite true
				retries - 1
			}
			javaexec {
				mainClass = "-jar"
				args = ["forge-installer.jar", "--installServer"]
				workingDir = "server"
			}
			if (!rootProject.forge_version.startsWith("1.16.5")) {
				javaexec {
					mainClass = "@libraries/net/minecraftforge/forge/${rootProject.forge_version}/${Os.isFamily(Os.FAMILY_WINDOWS) ? "win" : "unix"}_args.txt"
					args = ["nogui"]
					jvmArgs = ["-Xms4G", "-Xmx4G"]
					workingDir = "server"
				}
			}
		}
	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveForgeBuilds
		}
	}
}
